<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>__TITLE__</title>
<style>
/*__FONT__*/
/*__PAGE__*/
:root { /*__THEME__*/ }
* { box-sizing: border-box; }
body {
  margin: 0; color: var(--text); background: var(--bg);
  font-family: Sarabun, sans-serif; font-size: var(--base); line-height: 1.6;
  -webkit-print-color-adjust: exact; print-color-adjust: exact;
}
h1 { font-size: 1.9em; line-height: 1.25; margin: 0 0 .4em; color: var(--primary); }
h2 { font-size: 1.35em; line-height: 1.3; margin: 1em 0 .3em; color: var(--primary); break-after: avoid; }
h3 { font-size: 1.12em; margin: .8em 0 .2em; break-after: avoid; }
h4 { font-size: 1em; margin: .6em 0 .2em; break-after: avoid; }
p { margin: .3em 0; }
ul { margin: .3em 0 .6em; padding-left: 1.2em; }
li { margin: .15em 0; }
.focused > h2::after, .focused > h3::after { content: "  เน้น"; font-size: .6em; color: var(--accent); vertical-align: middle; }
.rule { height: 4px; width: 48px; background: var(--accent); border-radius: 2px; margin-bottom: 1em; }
pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: .82em; line-height: 1.45; padding: .6em .8em; border-radius: 6px; background: var(--code-bg); break-inside: avoid; }
figure { margin: .6em 0; break-inside: avoid; }
figure img { max-width: 100%; max-height: 60vh; }
figcaption { font-size: .85em; color: var(--muted); }
.child { margin-left: .4em; padding-left: .8em; border-left: 3px solid var(--line); }
.glossary dt { font-weight: 700; color: var(--primary); }
.glossary dd { margin: 0 0 .4em; }
/* mind map style */
.mm-root { text-align: center; margin-bottom: 1em; }
.mm-root span { display: inline-block; padding: .5em 1.2em; border-radius: 999px; background: var(--primary); color: var(--on-primary); font-size: 1.4em; font-weight: 700; }
.mm-grid { display: flex; flex-wrap: wrap; gap: 4mm; }
.branch { flex: 1 1 60mm; border: 2px solid var(--primary); border-radius: 10px; padding: .6em .8em; break-inside: avoid; }
.branch.focused { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
.branch > h2 { margin: 0 0 .3em; font-size: 1.15em; }
.branch ul { padding-left: 1em; }
.branch .sub { font-weight: 700; }
</style>
</head>
<body>
<!--__BODY__-->
</body>
</html>
